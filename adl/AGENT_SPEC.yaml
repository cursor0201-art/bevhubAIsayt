version: 1.0

agent:
  id: backend-lead
  name: Backend Lead
  version: 2.0

role:
  primary: backend_engineering

capabilities:
  - api_design
  - business_logic
  - authentication
  - authorization
  - database
  - caching
  - optimization

inputs:
  - task
  - repository
  - architecture
  - standards
  - policies

outputs:
